name = "humanize-p5050-llama32-3b"
model = "meta-llama/Llama-3.2-3B-Instruct"
max_steps = 200
batch_size = 256
rollouts_per_example = 16
learning_rate = 8e-5
lora_alpha = 32

[sampling]
max_tokens = 4096
temperature = 0.7

[[env]]
id = "jayshah5696/humanize-rl-env"
name = "train_mix_v2_p5050"
version = "0.3.14"
args = { split = "train", task_set = "mix_v2_p5050", reward_mode = "p50_50_no_penalty" }

[eval]
interval = 50
num_examples = 64
rollouts_per_example = 2
eval_base_model = true

[eval.sampling]
max_tokens = 4096
temperature = 0.2

[[eval.env]]
id = "jayshah5696/humanize-rl-env"
name = "eval_mix_v2_p5050"
version = "0.3.14"
args = { split = "validation", task_set = "mix_v2_p5050", reward_mode = "p50_50_no_penalty" }

[[eval.env]]
id = "jayshah5696/humanize-rl-env"
name = "eval_v02_strict"
version = "0.3.14"
args = { split = "validation", task_set = "v02_smoke", reward_mode = "strict" }

[[eval.env]]
id = "jayshah5696/humanize-rl-env"
name = "eval_v03_strict"
version = "0.3.14"
args = { split = "validation", task_set = "v03", reward_mode = "strict" }

[val]
num_examples = 128
rollouts_per_example = 1
interval = 25

[wandb]
entity = "jayshah5696"
project = "humanize-rl"
name = "prime-llama32-3b-p5050"

[checkpoints]
interval = 50
keep_cloud = 3

[adapters]
interval = 0
keep_last = 2
