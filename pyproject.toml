[project]
name = "humanize-rl"
version = "0.1.0"
description = "Two-layer AI writing detection, scoring, and training pipeline"
readme = "README.md"
authors = [
    { name = "Jay Shah", email = "jayshah5696@gmail.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "arka",
    "datasets>=4.8.5",
    "einops>=0.8.2",
    "fasttext-wheel>=0.9.2",
    "huggingface-hub>=1.9.2",
    "langdetect>=1.0.9",
    "luxical>=1.1.2",
    "matplotlib>=3.10.9",
    "mlflow>=3.12.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.5.0",
    "spacy>=3.8.14",
    "torch>=2.12.0",
    "transformers>=5.8.1",
]

[project.scripts]
humanize-rl = "humanize_rl:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "datasets",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/humanize_rl",
    "--cov-report=term-missing",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv.sources]
arka = { git = "https://github.com/jayshah5696/arka.git", rev = "3cfa30176863ad44f3456444933f864918268b47" }

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"
