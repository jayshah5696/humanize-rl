# configs/v04/stream_a_evol_pilot_direct.yaml
version: "1"
run_id: null

llm:
  provider: openai
  model: google/gemini-3.1-flash-lite-preview
  api_key: ${OPENROUTER_API_KEY}
  base_url: https://openrouter.ai/api/v1
  timeout_seconds: 60
  max_retries: 3
  supports_json_schema: false
  openai_compatible:
    referer: https://github.com/jayshah5696/humanize-rl
    title: humanize-rl

executor:
  mode: threadpool
  max_workers: 1

pipeline:
  - type: seed_source
    path: ../../seeds/v04_task_seeds_pilot_direct.jsonl

  - type: normalize_conversation

  - type: evol_instruct_generator
    target_count: 25
    generation_multiplier: 1
    rounds: 1
    branching_factor: 1
    max_tokens: 1024
    operators:
      - add_constraints
      - deepen
    filter:
      min_edit_distance_chars: 20
      min_instruction_chars: 20
      refusal_keywords:
        - "I cannot"
        - "I'm unable"
        - "As an AI"

  - type: transform_generator
    input_field: payload.instruction
    output_field: payload.response
    max_tokens: 1024
    llm_override:
      model: google/gemini-3.1-flash-lite-preview
      max_tokens: 1024
    prompt_template: |
      You are a skilled writer. Generate a response to the following request.

      Rules (non-negotiable):
      - Use contractions where natural ("I'm", "we're", "it's", "don't")
      - Cut ALL filler: "it's worth noting", "furthermore", "in conclusion", "it is important to"
      - Vary sentence length — mix short punchy sentences with longer ones
      - First-person is fine and preferred ("I", "we")
      - Add specific, concrete detail only when the request provides enough context or asks you to invent a plausible draft. Do not fabricate operational details for factual workplace updates.
      - Do NOT start with "Certainly!", "Of course!", "Great question!", "I'd be happy to"
      - Do NOT end with "Please don't hesitate to reach out"
      - If it's a Slack message: keep it brief and casual (under 4 sentences)
      - If it's an email: no bullet lists unless truly necessary
      - Write in a natural, direct, human tone.

      Request:
      {input_text}

      Return the response inside a JSON object with a single key "text". Example:
      {{"text": "Your response here"}}
      Make sure to escape any newlines as "\n" and double quotes as "\"" inside the JSON string!

  - type: exact

  - type: near
    lsh_bands: 16

  - type: length
    min_instruction_chars: 20
    max_instruction_chars: 800
    min_response_chars: 20
    max_response_chars: 2000

  - type: language
    allowed: [en]


output:
  format: jsonl
  path: ../../data/processed/v04_stream_a_pilot_direct.jsonl
