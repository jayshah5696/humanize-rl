name = "humanize-sft-qwen35-2b-gemini-env0314-full-r1"
model = "Qwen/Qwen3.5-2B"
loss = "sft"
max_steps = 200
batch_size = 128
rollouts_per_example = 1
max_inflight_rollouts = 32
learning_rate = 2e-5
lora_alpha = 32

[teacher]
model = "google/gemini-3-flash-preview"

[teacher.client]
base_url = "https://openrouter.ai/api/v1"
api_key_var = "OPENROUTER_API_KEY"
skip_model_check = true

[teacher.sampling]
max_tokens = 4096
temperature = 0.2

[sampling]
max_tokens = 4096
temperature = 0.2
enable_thinking = false

[[env]]
id = "jayshah5696/humanize-rl-env"
name = "train_mix_v2_p5050_sft_gemini_full_r1"
version = "0.3.14"
args = { split = "train", task_set = "mix_v2_p5050", reward_mode = "p50_50_no_penalty" }

[eval]
interval = 50
num_examples = 96
rollouts_per_example = 1
eval_base_model = true

[eval.sampling]
max_tokens = 4096
temperature = 0.0
enable_thinking = false

[[eval.env]]
id = "jayshah5696/humanize-rl-env"
name = "eval_mix_v2_p5050"
version = "0.3.14"
args = { split = "validation", task_set = "mix_v2_p5050", reward_mode = "p50_50_no_penalty" }

[[eval.env]]
id = "jayshah5696/humanize-rl-env"
name = "eval_v02_strict"
version = "0.3.14"
args = { split = "validation", task_set = "v02_smoke", reward_mode = "strict" }

[[eval.env]]
id = "jayshah5696/humanize-rl-env"
name = "eval_v03_strict"
version = "0.3.14"
args = { split = "validation", task_set = "v03", reward_mode = "strict" }

[val]
num_examples = 96
rollouts_per_example = 1
interval = 20

[wandb]
entity = "jayshah5696"
project = "humanize-rl"
name = "prime-qwen35-2b-sft-gemini-env0314-full-r1"

[checkpoints]
interval = 50
keep_cloud = 4

[adapters]
interval = 50
keep_last = 4

[infrastructure]
compute_size = "L"
