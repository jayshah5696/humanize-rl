# Slice 6 Ablation B0 \u2014 baseline group/batch/LR.
# Plan: docs/plans/gemma4_rl_modal_stable_training_continuation.md \u00a78 Ablation B / Slice 6.
#
# Reproduces the Slice 5 A2 winner config (softened reward) at the
# baseline group/batch/LR. The B0/B1/B2 trio tests the Prime-style
# guidance to grow group size and reduce LR for smoother training.
#
# Cost projection: 50 steps at ~9s/step \u2248 7.5 min \u2248 $0.27.

model_name: "jayshah5696/gemma4-e2b-humanize-unsloth-merged"
experiment_name: "gemma4-rl-ablation-b0-g8-acc8-lr2e5"
hf_lora_repo: "jayshah5696/gemma4-rl-ablation-b0-lora"

task_path: "data/rl/humanize_tasks_rl_mix_v1_filtered_softened_midband.jsonl"
train_split: train
eval_split: validation

max_seq_length: 2048
max_prompt_length: 512
max_completion_length: 768

lora_rank: 16
lora_alpha: 32

# === Variables under test ===
learning_rate: 2.0e-5
num_generations: 8
gradient_accumulation_steps: 8

# Held constant across B0/B1/B2.
max_steps: 50
per_device_train_batch_size: 1
warmup_ratio: 0.1
weight_decay: 0.001
max_grad_norm: 0.5
optim: adamw_8bit
loss_type: bnpo
epsilon: 0.2
epsilon_high: 0.28
delta: 1.5
mask_truncated_completions: true
temperature: 1.0
seed: 3407

stratify_batches: true
stratify_by: reward_profile

# Winner from Slice 5: softened scalar reward.
reward_mode: scalar_softened
penalty_cap: 1.0
ridge_weight: 0.45
deterministic_weight: 0.35
risk_weight: 0.20

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.55

sample_before_after: 0
generation_batch_size: 8
artifact_generation_samples: 0

push_to_hub: false
report_to: wandb
wandb_project: "humanize-rl"
