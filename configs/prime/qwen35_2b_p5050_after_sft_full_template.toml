name = "humanize-rl-qwen35-2b-p5050-after-sft-env0314-full-r1"
model = "Qwen/Qwen3.5-2B"
max_steps = 200
batch_size = 256
rollouts_per_example = 16
max_inflight_rollouts = 64
learning_rate = 8e-5
lora_alpha = 32

# Fill this with the READY checkpoint id from the Hosted SFT run.
# checkpoint_id = "..."

[sampling]
max_tokens = 4096
temperature = 0.7
enable_thinking = false

[[env]]
id = "jayshah5696/humanize-rl-env"
name = "train_mix_v2_p5050_after_sft_full_r1"
version = "0.3.14"
args = { split = "train", task_set = "mix_v2_p5050", reward_mode = "p50_50_no_penalty" }

[eval]
interval = 50
num_examples = 96
rollouts_per_example = 2
eval_base_model = false

[eval.sampling]
max_tokens = 4096
temperature = 0.2
enable_thinking = false

[[eval.env]]
id = "jayshah5696/humanize-rl-env"
name = "eval_mix_v2_p5050"
version = "0.3.14"
args = { split = "validation", task_set = "mix_v2_p5050", reward_mode = "p50_50_no_penalty" }

[[eval.env]]
id = "jayshah5696/humanize-rl-env"
name = "eval_v02_strict"
version = "0.3.14"
args = { split = "validation", task_set = "v02_smoke", reward_mode = "strict" }

[[eval.env]]
id = "jayshah5696/humanize-rl-env"
name = "eval_v03_strict"
version = "0.3.14"
args = { split = "validation", task_set = "v03", reward_mode = "strict" }

[val]
num_examples = 128
rollouts_per_example = 1
interval = 25

[wandb]
entity = "jayshah5696"
project = "humanize-rl"
name = "prime-qwen35-2b-p5050-after-sft-env0314-full-r1"

[checkpoints]
interval = 50
keep_cloud = 4

[adapters]
interval = 50
keep_last = 4

[infrastructure]
compute_size = "L"
