# Slice 5 Ablation A2 \u2014 softened scalar reward (plan \u00a76 Option C).
# Plan: docs/plans/gemma4_rl_modal_stable_training_continuation.md Slice 5.
#
# Predicted winner. ``risk_compliance = clip(1 + sum(pen)/penalty_cap, 0, 1)``
# replaces the raw penalty sum, lifting the reward floor and producing
# a smoother gradient.
#
# Slice 4 follow-up evidence (data already in hand):
#   * 24.3% useful under default softened thresholds (vs 4.9% strict).
#   * 83.6% useful under the mid-band thresholds this config trains on.
#   * Per-task reward shifts monotonically up vs strict reward.
#
# Cost projection: identical to A0/A1 (~$0.27).

model_name: "jayshah5696/gemma4-e2b-humanize-unsloth-merged"
experiment_name: "gemma4-rl-ablation-a2-scalar-softened"
hf_lora_repo: "jayshah5696/gemma4-rl-ablation-a2-lora"

task_path: "data/rl/humanize_tasks_rl_mix_v1_filtered_softened_midband.jsonl"
train_split: train
eval_split: validation

max_seq_length: 2048
max_prompt_length: 512
max_completion_length: 768

lora_rank: 16
lora_alpha: 32

learning_rate: 2.0e-5
max_steps: 50
num_generations: 8
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
warmup_ratio: 0.1
weight_decay: 0.001
max_grad_norm: 0.5
optim: adamw_8bit
loss_type: bnpo
epsilon: 0.2
epsilon_high: 0.28
delta: 1.5
mask_truncated_completions: true
temperature: 1.0
seed: 3407

stratify_batches: true
stratify_by: reward_profile

# === The variable under test ===
reward_mode: scalar_softened
penalty_cap: 1.0
ridge_weight: 0.45
deterministic_weight: 0.35
risk_weight: 0.20

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.55

sample_before_after: 2
generation_batch_size: 8
artifact_generation_samples: 2

push_to_hub: false
report_to: wandb
wandb_project: "humanize-rl"
