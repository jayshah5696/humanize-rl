name = "humanize-p5050-qwen35-08b-docs-debug-r10"
model = "Qwen/Qwen3.5-0.8B"
max_steps = 1
batch_size = 16
rollouts_per_example = 4
learning_rate = 1e-4
lora_alpha = 32

[sampling]
max_tokens = 4096
temperature = 0.7
enable_thinking = false

[[env]]
id = "jayshah5696/humanize-rl-env"
name = "train_mix_v2_p5050_docs_debug_r10"
version = "0.3.14"
args = { split = "train", task_set = "mix_v2_p5050", reward_mode = "p50_50_no_penalty" }

[eval]
interval = 1
num_examples = 3
# Eval can stay single-rollout; the zero-advantage filter is a train-batch issue.
rollouts_per_example = 1
eval_base_model = true

[eval.sampling]
max_tokens = 4096
temperature = 0.2
enable_thinking = false

[[eval.env]]
id = "jayshah5696/humanize-rl-env"
name = "eval_mix_v2_p5050_docs_debug_r10"
version = "0.3.14"
args = { split = "validation", task_set = "mix_v2_p5050", reward_mode = "p50_50_no_penalty" }

[wandb]
entity = "jayshah5696"
project = "humanize-rl"
name = "prime-qwen35-08b-p5050-docs-debug-r10"

[checkpoints]
interval = 1
keep_cloud = 1

[adapters]
interval = 0
keep_last = 1
