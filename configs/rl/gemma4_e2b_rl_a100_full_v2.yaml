# Full RL run — v01+v02+v03 filtered mix, 600 steps.
# Plan: docs/plans/gemma4_rl_modal_full_run.md.
#
# Frozen recipe from Slices 5–8:
#   - B1 (D6.D1.1): G=16, acc=16, LR=1e-5
#   - C0 (D7.D1.2): scale_rewards="group"
#   - D6.D1.2: vllm_gpu_memory_utilization=0.55
#   - D5.1: scalar_softened reward
# Two new choices (full-run plan §3):
#   - penalty_cap: 1.0 → 1.5 (widen softened-reward linear region;
#     §3.2; addresses Slice 8's 99.8% penalty saturation)
#   - max_steps: 200 → 600 (§3.3; Slice 8 EMA still rising at 200;
#     resumable to 1,000 if EMA still rising at 600)
#
# Cost projection: 600 steps × 11.2 s/step ≈ 112 min ≈ $4.50.

model_name: "jayshah5696/gemma4-e2b-humanize-unsloth-merged"
experiment_name: "gemma4-rl-full-v2"
hf_lora_repo: "jayshah5696/gemma4-e2b-humanize-rl-candidate-v1"

task_path: "data/rl/humanize_tasks_rl_mix_v2_filtered_softened_midband.jsonl"
train_split: train
eval_split: validation

max_seq_length: 2048
max_prompt_length: 512
max_completion_length: 768

lora_rank: 16
lora_alpha: 32

# Frozen recipe.
learning_rate: 1.0e-5
num_generations: 16
gradient_accumulation_steps: 16
per_device_train_batch_size: 1
max_steps: 600

warmup_ratio: 0.1
weight_decay: 0.001
max_grad_norm: 0.5
optim: adamw_8bit
loss_type: bnpo
epsilon: 0.2
epsilon_high: 0.28
delta: 1.5
mask_truncated_completions: true
temperature: 1.0
seed: 3407

stratify_batches: true
stratify_by: reward_profile

# Reward — D5.1 + §3.2 penalty-cap recalibration.
reward_mode: scalar_softened
penalty_cap: 1.5
ridge_weight: 0.45
deterministic_weight: 0.35
risk_weight: 0.20

# D7.D1.2.
scale_rewards: "group"

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.55

sample_before_after: 0
generation_batch_size: 8
artifact_generation_samples: 0

push_to_hub: false
report_to: wandb
wandb_project: "humanize-rl"
