name = "humanize-p5050-qwen35-2b"
model = "Qwen/Qwen3.5-2B"
max_steps = 200
batch_size = 256
rollouts_per_example = 16
learning_rate = 1e-4
lora_alpha = 32

[sampling]
max_tokens = 4096
temperature = 0.7
enable_thinking = false

[[env]]
id = "jayshah5696/humanize-rl-env"
name = "train_mix_v2_p5050"
version = "0.3.14"
args = { split = "train", task_set = "mix_v2_p5050", reward_mode = "p50_50_no_penalty" }

[eval]
interval = 50
num_examples = 96
rollouts_per_example = 2
eval_base_model = true

[eval.sampling]
max_tokens = 4096
temperature = 0.2
enable_thinking = false

[[eval.env]]
id = "jayshah5696/humanize-rl-env"
name = "eval_mix_v2_p5050"
version = "0.3.14"
args = { split = "validation", task_set = "mix_v2_p5050", reward_mode = "p50_50_no_penalty" }

[[eval.env]]
id = "jayshah5696/humanize-rl-env"
name = "eval_v02_strict"
version = "0.3.14"
args = { split = "validation", task_set = "v02_smoke", reward_mode = "strict" }

[[eval.env]]
id = "jayshah5696/humanize-rl-env"
name = "eval_v03_strict"
version = "0.3.14"
args = { split = "validation", task_set = "v03", reward_mode = "strict" }

[val]
num_examples = 96
rollouts_per_example = 1
interval = 20

[wandb]
entity = "jayshah5696"
project = "humanize-rl"
name = "prime-qwen35-2b-p5050"

[checkpoints]
interval = 50
keep_cloud = 4

[adapters]
interval = 50
keep_last = 3
