# configs/v03/v03_compression.yaml
# Generate "compress this source to a bounded summary preserving facts" tasks.
version: "1"
run_id: null

llm:
  provider: openai
  model: google/gemini-3.1-pro-preview
  api_key: ${OPENROUTER_API_KEY}
  base_url: https://openrouter.ai/api/v1
  timeout_seconds: 90
  max_retries: 3
  supports_json_schema: false
  openai_compatible:
    referer: https://github.com/jayshah5696/humanize-rl
    title: humanize-rl

executor:
  mode: threadpool
  max_workers: 8

pipeline:
  - type: seed_source
    path: ../../data/raw/v03_writing_seeds.jsonl

  - type: normalize_conversation

  - type: transform_generator
    input_field: payload.response   # seed.response holds the source text
    output_field: payload.response
    target_count: 1
    generation_multiplier: 1
    temperature: 0.7
    max_tokens: 16000
    prompt_template: |
      You are designing a compression task. Given an AI-sounding source text,
      write a brief asking a writer to compress it to 30–80 words while
      preserving the key facts.

      Output exactly one JSON object inside {{"text": "..."}}, with the value
      being a JSON-escaped string containing this schema:

        - instruction: 60–140 words. Use slots [TASK]/[AUDIENCE]/[CONTENT]/
          [FORMAT]/[MUST]/[MUST_NOT]. Make it sound like a real request.
        - input_text: source text verbatim.
        - constraints: object with
            target_words (int in [30, 80]),
            target_tolerance (0.25),
            must_include_phrases (≤3 critical facts from the source — names,
              numbers, dates, decisions),
            must_not_include_phrases (1–2 AI fluff phrases),
            must_not_use_em_dash (true),
            register_target (one of casual, direct, formal),
            no_subject_line (true),
            no_signoff (true),
            allow_bullets (false),
            max_sentences (4),
            must_contain_number_kind (one of percent, currency, count, date,
              time, any — pick the kind most relevant to the source).
        - domain: pick the best fit.
        - register: same as register_target.
        - trap_tags: 2–4 of [verbosity, over_polish, missing_fact,
          corporate_filler, hedge_stacking].
        - reward_profile: "compression_update".

      Source text:
      {input_text}

      Return ONLY {{"text": "..."}} with the inner JSON correctly escaped.

  - type: exact

  - type: near
    lsh_bands: 16

  - type: length
    min_instruction_chars: 1
    max_instruction_chars: 50000
    min_response_chars: 250
    max_response_chars: 7000

  - type: language
    allowed: [en]

  # Judge stage moved out of per-mode arka runs (see scripts/data/build/judge_v03_tasks.py)

output:
  format: jsonl
  path: ../../data/processed/v03_compression.jsonl
